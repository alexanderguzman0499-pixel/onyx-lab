<!doctype html>
<html lang="es" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solicitud recibida — Onyx Lab</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="blob-field" aria-hidden="true">
    <div class="blob-wrap" data-depth="1.1"><div class="blob blob-a"></div></div>
    <div class="blob-wrap" data-depth="0.6"><div class="blob blob-b"></div></div>
    <div class="blob-wrap" data-depth="1.5"><div class="blob blob-c"></div></div>
    <div class="blob-wrap" data-depth="0.4"><div class="blob blob-d"></div></div>
    <div class="blob-wrap" data-depth="0.9"><div class="blob blob-e"></div></div>
  </div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap">
      <a href="/" class="logo"><span class="mark">O</span> ONYX LAB</a>
    </div>
  </header>

  <main>
    <section class="hero center">
      <div class="wrap" style="max-width:600px;">
        <span class="eyebrow">Solicitud enviada</span>
        <h1 style="font-size: clamp(1.9rem, 3.5vw, 2.6rem);">Gracias — hemos recibido tu solicitud de acceso</h1>
        <p class="lead" style="margin-left:auto;margin-right:auto;">Nuestro equipo revisará la información institucional proporcionada y se pondrá en contacto para continuar con el proceso de verificación.</p>
        <div class="hero-actions center" style="justify-content:center;">
          <a href="/" class="btn btn-primary">Volver al inicio</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-legal">
        <span>© <span id="year"></span> Onyx Lab. Todos los derechos reservados.</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
